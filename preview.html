<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FAMOUS: Favicon networks</title>
  <link rel="icon" href="./famous-icon.png" type="image/png">
  <link rel="stylesheet" href="./preview.css">
  <script defer src="./vendor/cytoscape.min.js"></script>
  <script type="module" src="./preview.js"></script>
</head>
<body>
  <main class="preview">
    <header>
      <label for="favicon-group">Favicon group</label>
      <div class="controls"><select id="favicon-group" disabled aria-describedby="caption"><option>Loading groups…</option></select><button id="reset" type="button" disabled>Reset view</button></div>
    </header>
    <p id="caption">Sites sharing a favicon, connected by shared infrastructure.</p>
    <div id="network" role="img" aria-label="Favicon network"></div>
    <p id="counts" class="counts" role="status" aria-live="polite"></p>
    <p id="selection" class="selection" role="status" aria-live="polite">Select a site to highlight its connections.</p>
    <noscript>Enable JavaScript to explore the favicon network.</noscript>
  </main>
</body>
</html>
